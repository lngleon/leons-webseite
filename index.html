<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <!-- Favicon-Satz (steht im Template und landet dadurch in Dev UND in allen
         prerenderten dist-Heads; prerender.mjs strippt nur Title + Description-Meta,
         sonst nichts). SVG primaer (moderne Browser), .ico Fallback (Legacy, sizes
         any = SVG gewinnt wo unterstuetzt), PNG-Sizes + Apple-Touch-Icon. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <!-- theme-color = --background (#0a0a0a); Meta-Tags können kein var() nutzen → Literal. -->
    <meta name="theme-color" content="#0a0a0a" />
    <!-- Default-/Dev-Head. Im Build überschreibt scripts/prerender.mjs Title +
         Description (+ OpenGraph) pro Route (Werte in dessen META-Map). -->
    <meta
      name="description"
      content="Moderne Webseiten, Web-Apps und KI-Lösungen – individuell programmiert von Leon Lang. Von der Idee bis zum Launch, alles aus einer Hand."
    />
    <title>Leon Lang – Webseiten, Web-Apps &amp; KI-Integration</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
